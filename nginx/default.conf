# Reverse proxy in front of `web` and `api` (blueprint §21) — the single
# origin the browser talks to. /api/* goes to the FastAPI backend,
# everything else goes to the built frontend (which nginx inside the
# `web` container serves, itself falling back to index.html for
# client-side routes — see web/Dockerfile).

server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HYBRID-mode narrative generation is a single long-running POST
        # (~45s+ on this machine's GPU-backed Ollama, per Part 6b/6c) —
        # nginx's default 60s proxy_read_timeout is survivable but close
        # enough to raise for headroom.
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
