name: sar-copilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sarcopilot}
      POSTGRES_USER: ${DB_USER:-sar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sarpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sar} -d ${DB_NAME:-sarcopilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sarnet]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [sarnet]

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
    volumes:
      - ollamadata:/root/.ollama
      - ./scripts/pull-model.sh:/pull-model.sh:ro
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && sh /pull-model.sh && wait"]
    ports:
      - "11434:11434"
    # GPU reservation (Compose Specification, works with `docker compose up`
    # directly — not Swarm-only). Confirmed working on this machine's RTX
    # 4060 via `nvidia-smi` + `docker run --gpus all ... nvidia-smi` before
    # this was added. No CPU-only fallback path — GPU is confirmed present,
    # so this targets it directly (see blueprint §9.3's model choice
    # rationale: an 8B model at q4_K_M fits comfortably in 8GB VRAM).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q llama3.1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s  # first pull (~5GB) is slow
    networks: [sarnet]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-sar}:${DB_PASSWORD:-sarpass}@postgres:5432/${DB_NAME:-sarcopilot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PROMPT_VERSION: ${PROMPT_VERSION:-v1.0.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      ollama:   { condition: service_started }  # not service_healthy — don't block api startup on the multi-minute first model pull
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli seed --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/srv/data
      - ./eval:/srv/eval
    # GPU reservation (Part 5): the semantic entailment check's local NLI
    # model (domain/verification/semantic.py) uses the same RTX 4060 the
    # `ollama` service above already confirmed works with this exact
    # reservation block. Not required — the check runs on CPU if this is
    # unavailable in a given environment — just faster when it's there.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [sarnet]

  # TODO(part 3+): async narrative generation needs a worker.
  # worker:
  #   build: { context: ./api }
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://${DB_USER:-sar}:${DB_PASSWORD:-sarpass}@postgres:5432/${DB_NAME:-sarcopilot}
  #     REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  #     OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  #     LLM_MODEL: ${LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
  #   depends_on:
  #     api:    { condition: service_started }
  #     ollama: { condition: service_started }
  #   command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
  #   networks: [sarnet]

  # TODO(part 3+): scheduled jobs (e.g. periodic detection runs).
  # beat:
  #   build: { context: ./api }
  #   environment:
  #     DATABASE_URL: postgresql+psycopg://${DB_USER:-sar}:${DB_PASSWORD:-sarpass}@postgres:5432/${DB_NAME:-sarcopilot}
  #     REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  #   depends_on:
  #     redis: { condition: service_healthy }
  #   command: celery -A app.workers.celery_app beat --loglevel=info
  #   networks: [sarnet]

  web:
    build:
      context: ./web
      args:
        # Relative, not localhost:8000 — the browser now talks to whatever
        # origin served the page (the `nginx` service below), which proxies
        # /api/* through to `api` internally. Baked in at build time since
        # Vite env vars are compiled into the bundle, not read at runtime.
        VITE_API_BASE_URL: /api/v1
    networks: [sarnet]

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    networks: [sarnet]

volumes:
  pgdata:
  redisdata:
  ollamadata:

networks:
  sarnet:
    driver: bridge
